# Builds bada ime for macOS on GitHub (no Mac needed to build): the engine's tests, the profile-key
# test, then BadaIME.app (universal), uploaded as the artifact "BadaIME" (a zip). It's signed with the
# owner's Apple Development certificate (secrets MAC_SIGNING_P12, base64 of a .p12, and
# MAC_SIGNING_PASSWORD), as `make` signs it locally, so macOS keeps the app's Input Monitoring and
# Accessibility permissions across installs. Pull requests build ad-hoc signed (no secrets there).
# Install a run's app with mac/tools/install-ci.sh. A v* tag also attaches the zip to its release
# (a draft is created if there is none yet).

name: mac

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "engine/**"
      - "mac/**"
      - "docs/layouts/*.json"
      - ".github/workflows/mac.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test and build BadaIME.app
    runs-on: macos-26   # the macOS 26 SDK: NSGlassEffectView (SuggestionWindow.swift)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            engine -> target/mac
      - name: Engine tests
        working-directory: engine
        run: cargo test
      - name: Profile keys test
        run: mac/tools/test_profile_keys.sh
      - name: Signing certificate
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No MAC_SIGNING_P12 secret: building ad-hoc signed"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
      - name: Build BadaIME.app
        working-directory: mac
        run: |
          make dist
          codesign -dvv build/BadaIME.app 2>&1 | grep -E "Authority|Signature" || true
      - name: Version
        id: v
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' mac/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: BadaIME
          path: mac/build/BadaIME-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          zip="mac/build/BadaIME-${{ steps.v.outputs.version }}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --draft --title "bada ime ${{ steps.v.outputs.version }}" --generate-notes
          fi
