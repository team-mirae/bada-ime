# Deploys the web simulator (web/) to Vercel, bada.sjun.me, on every push to main that touches the
# page or the engine and data it runs. The smoke test (web/test/smoke.mjs: the engine as WebAssembly,
# typing on the shipped data) and the Learn Korean test (web/test/learn.mjs: every drill types as
# written) gate the deploy.
#
# The site is built here, not on Vercel: it compiles the engine to wasm with Rust, which Vercel's
# build image doesn't have. `node web/build.mjs --vercel` writes web/.vercel/output (the Build Output
# API) and `vercel deploy --prebuilt` uploads it, the same as deploying by hand from web/.
#
# Needs the repository secret VERCEL_ACCESS_TOKEN (a Vercel access token for the themrsungs-projects team).

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine/**"
      - "docs/layouts/*.json"
      - "tools/render/keyboards.js"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not secrets: they name the Vercel team and project.
  VERCEL_ORG_ID: team_CzVKrhjMVhZUWfSbyNlJbMSP
  VERCEL_PROJECT_ID: prj_Fol9k4slgANfm5Ar0BVg431ur5tM

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bada.sjun.me
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (the engine to wasm, the page, the data)
        run: node web/build.mjs --vercel
      - name: Smoke test
        run: node web/test/smoke.mjs
      - name: Learn Korean drills
        run: node web/test/learn.mjs
      - name: Deploy to production
        working-directory: web
        run: npx --yes vercel@62 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
